<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STRIKE — 3D Web FPS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2327e8ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2327e8ff'/%3E%3C/svg%3E">
<style>
  :root {
    --neon: #27e8ff;
    --neon-dim: #17a0b4;
    --danger: #ff3b3b;
    --warn: #ffcf3b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  body { font-family: "Courier New", monospace; color: #d7faff; user-select: none; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.visible { display: block; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  }
  #crosshair span {
    position: absolute; background: var(--neon);
    box-shadow: 0 0 6px var(--neon);
  }
  #crosshair .t { left: -1px; bottom: 5px; width: 2px; height: 7px; }
  #crosshair .b { left: -1px; top: 5px;    width: 2px; height: 7px; }
  #crosshair .l { top: -1px;  right: 5px;  width: 7px; height: 2px; }
  #crosshair .r { top: -1px;  left: 5px;   width: 7px; height: 2px; }
  #crosshair .dot { left: -1px; top: -1px; width: 2px; height: 2px; }
  #crosshair.hidden { display: none; }

  #hitmarker {
    position: absolute; left: 50%; top: 50%; width: 28px; height: 28px;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0; transition: opacity 0.18s ease-out;
  }
  #hitmarker span { position: absolute; background: #fff; box-shadow: 0 0 6px #fff; }
  #hitmarker .t { left: 13px; top: 0;    width: 2px; height: 8px; }
  #hitmarker .b { left: 13px; bottom: 0; width: 2px; height: 8px; }
  #hitmarker .l { top: 13px;  left: 0;   width: 8px; height: 2px; }
  #hitmarker .r { top: 13px;  right: 0;  width: 8px; height: 2px; }
  #hitmarker.kill span { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  #vignette {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 20, 20, 0.55) 100%);
    transition: opacity 0.35s ease-out;
  }
  #lowhp {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 0, 0, 0.35) 100%);
    animation: lowhp-pulse 1.1s ease-in-out infinite;
    animation-play-state: paused;
  }
  #lowhp.active { animation-play-state: running; }
  @keyframes lowhp-pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.65; } }

  /* damage direction indicators */
  .dmgdir {
    position: absolute; left: 50%; top: 50%; width: 120px; height: 120px;
    margin: -60px 0 0 -60px; opacity: 0; transition: opacity 0.5s ease-out;
  }
  .dmgdir::before {
    content: ""; position: absolute; left: 50%; top: -34px;
    margin-left: -22px; border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 16px solid rgba(255, 45, 45, 0.85);
    filter: drop-shadow(0 0 8px rgba(255, 45, 45, 0.9));
  }

  /* sniper scope */
  #scope { position: absolute; inset: 0; display: none; }
  #scope.visible { display: block; }
  #scope .mask {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center,
      transparent 0, transparent 31vmin, rgba(2, 4, 8, 0.985) 33vmin);
  }
  #scope .lineh, #scope .linev { position: absolute; background: rgba(180, 245, 255, 0.9); }
  #scope .lineh { left: 50%; top: 15%; width: 1px; height: 70%; transform: translateX(-0.5px); }
  #scope .linev { top: 50%; left: 15%; height: 1px; width: 70%; transform: translateY(-0.5px); }

  .panel {
    position: absolute; padding: 10px 16px;
    background: rgba(5, 12, 20, 0.55);
    border: 1px solid rgba(39, 232, 255, 0.35);
    border-radius: 4px;
    text-shadow: 0 0 8px rgba(39, 232, 255, 0.8);
  }

  #health-panel { left: 24px; bottom: 24px; min-width: 220px; }
  #health-label { font-size: 12px; letter-spacing: 2px; color: var(--neon-dim); }
  #health-value { font-size: 30px; font-weight: bold; line-height: 1; }
  #health-bar-track {
    margin-top: 6px; height: 8px; background: rgba(255,255,255,0.08);
    border-radius: 2px; overflow: hidden;
  }
  #health-bar {
    height: 100%; width: 100%; background: var(--neon);
    box-shadow: 0 0 8px var(--neon); transition: width 0.15s ease-out;
  }
  #armor-track {
    margin-top: 4px; height: 5px; background: rgba(255,255,255,0.06);
    border-radius: 2px; overflow: hidden;
  }
  #armor-bar {
    height: 100%; width: 0; background: #6aa8ff;
    box-shadow: 0 0 8px #6aa8ff; transition: width 0.15s ease-out;
  }
  #mount-hint {
    position: absolute; left: 50%; top: 64%; transform: translateX(-50%);
    font-size: 15px; letter-spacing: 3px; color: var(--warn);
    text-shadow: 0 0 10px var(--warn); display: none;
  }
  #mount-hint.visible { display: block; }
  #vehicle-hp {
    position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%);
    font-size: 14px; letter-spacing: 3px; color: #9dff6a;
    text-shadow: 0 0 10px #9dff6a; display: none;
  }
  #vehicle-hp.visible { display: block; }
  #oob-warning {
    position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
    font-size: 20px; letter-spacing: 4px; color: #ff5a4d;
    text-shadow: 0 0 14px #ff5a4d; display: none;
    animation: oob-pulse 0.8s ease-in-out infinite;
  }
  #oob-warning.visible { display: block; }
  @keyframes oob-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .pick-row { display: flex; gap: 12px; margin: 8px 0 4px; flex-wrap: wrap; justify-content: center; }
  .pick {
    pointer-events: auto; cursor: pointer; font-family: inherit;
    font-size: 14px; letter-spacing: 2px; color: #8fd8e6;
    background: rgba(5, 12, 20, 0.6); border: 1px solid rgba(39, 232, 255, 0.35);
    border-radius: 3px; padding: 10px 20px;
  }
  .pick.sel {
    color: #05121a; background: var(--neon);
    box-shadow: 0 0 14px rgba(39, 232, 255, 0.7);
  }
  .pick small { display: block; font-size: 10px; letter-spacing: 1px; margin-top: 3px; }
  .setup-label { font-size: 12px; letter-spacing: 3px; color: var(--neon-dim); margin-top: 18px; }
  #health-panel.hurt #health-bar { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  #health-panel.hurt #health-value { color: var(--danger); }

  #ammo-panel { right: 24px; bottom: 24px; text-align: right; min-width: 200px; }
  #weapon-name { font-size: 12px; letter-spacing: 2px; color: var(--neon-dim); }
  #ammo-value { font-size: 30px; font-weight: bold; line-height: 1.1; }
  #ammo-reserve { font-size: 15px; color: #7fdceb; }
  #grenade-row { font-size: 14px; color: var(--warn); letter-spacing: 3px; margin-top: 2px; }
  #reload-hint { font-size: 12px; color: var(--warn); visibility: hidden; }
  #reload-hint.visible { visibility: visible; animation: blink 0.6s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  #score-panel { top: 20px; right: 24px; text-align: right; min-width: 150px; }
  #score-value { font-size: 24px; font-weight: bold; }
  #score-label, #wave-label { font-size: 11px; letter-spacing: 2px; color: var(--neon-dim); }
  #wave-value { font-size: 18px; font-weight: bold; }
  #enemies-left { font-size: 12px; color: #7fdceb; }
  #streak-value { font-size: 12px; color: var(--warn); min-height: 15px; }

  #killfeed {
    position: absolute; top: 175px; right: 24px; text-align: right;
    font-size: 12px; letter-spacing: 1px;
  }
  #killfeed div {
    margin-top: 4px; padding: 3px 10px;
    background: rgba(5, 12, 20, 0.5);
    border-right: 2px solid var(--danger);
    color: #ffb4b4; opacity: 1; transition: opacity 0.6s ease;
  }
  #killfeed div.fading { opacity: 0; }

  #radar-panel { left: 24px; top: 20px; padding: 8px; }
  #radar { display: block; }

  #compass {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 340px; height: 30px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }

  #banner {
    position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
    font-size: 42px; font-weight: bold; letter-spacing: 6px; white-space: nowrap;
    color: var(--neon); text-shadow: 0 0 18px var(--neon), 0 0 40px rgba(39,232,255,.6);
    opacity: 0; transition: opacity 0.4s ease;
  }
  #banner.visible { opacity: 1; }
  #banner.danger { color: var(--danger); text-shadow: 0 0 18px var(--danger); }
  #banner.streak { color: var(--warn); text-shadow: 0 0 18px var(--warn); }

  #subbanner {
    position: absolute; top: calc(20% + 56px); left: 50%; transform: translateX(-50%);
    font-size: 16px; letter-spacing: 3px; color: #9feeff; white-space: nowrap;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #subbanner.visible { opacity: 1; }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8, 16, 30, 0.82), rgba(2, 4, 9, 0.96));
    z-index: 10; text-align: center;
  }
  .screen.visible { display: flex; }
  .screen h1 {
    font-size: 64px; letter-spacing: 12px; color: var(--neon);
    text-shadow: 0 0 24px var(--neon), 0 0 70px rgba(39,232,255,.5);
    margin-bottom: 8px;
  }
  .screen h2 { font-size: 28px; letter-spacing: 6px; margin-bottom: 18px; }
  .screen .sub { color: #8fd8e6; font-size: 15px; margin-bottom: 26px; letter-spacing: 2px; }
  .screen .stats { font-size: 20px; margin-bottom: 26px; line-height: 1.8; }
  .screen .stats b { color: var(--neon); }
  .btn {
    pointer-events: auto; cursor: pointer;
    font-family: inherit; font-size: 18px; letter-spacing: 3px;
    color: #05121a; background: var(--neon);
    border: none; border-radius: 3px; padding: 14px 42px;
    box-shadow: 0 0 18px rgba(39, 232, 255, 0.7);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(39, 232, 255, 1); }
  .controls {
    margin-top: 30px; font-size: 13px; color: #6fb7c4; line-height: 2.1; letter-spacing: 1px;
  }
  .controls b { color: #d7faff; background: rgba(255,255,255,0.08); padding: 1px 7px; border-radius: 3px; }
  #gameover-screen h1 { color: var(--danger); text-shadow: 0 0 24px var(--danger); }

  .settings {
    margin-top: 30px; font-size: 13px; letter-spacing: 2px; color: #8fd8e6;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .settings label { display: flex; align-items: center; gap: 12px; }
  .settings input[type="range"] {
    pointer-events: auto; width: 180px; accent-color: var(--neon);
  }
  .arsenal {
    margin-top: 26px; font-size: 12px; color: #6fb7c4; letter-spacing: 1px; line-height: 1.9;
  }
  .arsenal b { color: var(--neon); }
  .arsenal .locked { color: #4a6570; }
  #menu-rank { font-size: 13px; letter-spacing: 2px; color: var(--warn); margin-bottom: 20px; }

  /* ---------- Cheat console ---------- */
  #cheat-menu {
    position: fixed; top: 50%; right: 30px; transform: translateY(-50%);
    width: 430px; z-index: 20; display: none;
    background: rgba(4, 9, 16, 0.92);
    border: 1px solid rgba(255, 207, 59, 0.5);
    border-radius: 4px; padding: 14px 0 10px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
  }
  #cheat-menu.visible { display: block; }
  #cheat-menu .cm-title {
    font-size: 16px; letter-spacing: 4px; color: var(--warn);
    text-shadow: 0 0 10px rgba(255, 207, 59, 0.7);
    padding: 0 16px 4px;
  }
  #cheat-menu .cm-hint {
    font-size: 11px; letter-spacing: 1px; color: #7d8a99; padding: 0 16px 10px;
    border-bottom: 1px solid rgba(255, 207, 59, 0.2);
  }
  #cheat-list { list-style: none; max-height: 60vh; overflow-y: auto; }
  #cheat-list li {
    pointer-events: auto; cursor: pointer;
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 16px; font-size: 13px; letter-spacing: 1px;
    border-left: 3px solid transparent;
  }
  #cheat-list li.selected {
    background: rgba(255, 207, 59, 0.1);
    border-left-color: var(--warn);
  }
  #cheat-list .cm-name { color: #e8f4ff; white-space: nowrap; }
  #cheat-list .cm-desc { color: #667a8a; font-size: 11px; flex: 1; }
  #cheat-list .cm-state { color: #667a8a; font-weight: bold; }
  #cheat-list .cm-state.on { color: #4dff88; text-shadow: 0 0 8px rgba(77, 255, 136, 0.8); }
  #cheat-list .cm-state.action { color: var(--warn); }

  #cheat-frame {
    position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none;
    border: 2px dashed rgba(255, 70, 70, 0.55);
  }
  #cheat-frame.visible { display: block; }
  #cheat-badge {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; color: #ff6a6a;
    background: rgba(30, 5, 5, 0.8); border: 1px solid rgba(255, 70, 70, 0.5);
    padding: 2px 12px; border-radius: 3px;
  }
  #killfeed div.cheat {
    border-right-color: var(--warn); color: #ffe9a8;
  }

  /* ---------- language toggle ---------- */
  #lang-btn {
    position: fixed; top: 16px; right: 20px; z-index: 30;
    pointer-events: auto; cursor: pointer;
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    color: var(--neon); background: rgba(5, 12, 20, 0.7);
    border: 1px solid rgba(39, 232, 255, 0.4); border-radius: 3px;
    padding: 6px 14px; display: none;
  }
  #lang-btn.visible { display: block; }
  #lang-btn:hover { background: rgba(39, 232, 255, 0.15); }

  /* ---------- multiplayer screens ---------- */
  .btn.secondary {
    background: transparent; color: var(--neon);
    border: 1px solid rgba(39, 232, 255, 0.5);
    box-shadow: none;
  }
  .btn.secondary:hover { background: rgba(39, 232, 255, 0.12); box-shadow: none; }
  .btn-row { display: flex; gap: 16px; margin-top: 4px; }
  .mp-form {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    margin-bottom: 8px;
  }
  .mp-form .row { display: flex; gap: 10px; align-items: center; }
  .mp-form label { font-size: 12px; letter-spacing: 2px; color: var(--neon-dim); }
  .mp-form input {
    pointer-events: auto; font-family: inherit; font-size: 16px; letter-spacing: 2px;
    color: #d7faff; background: rgba(5, 12, 20, 0.7);
    border: 1px solid rgba(39, 232, 255, 0.4); border-radius: 3px;
    padding: 8px 12px; width: 200px; text-transform: uppercase;
  }
  .mp-form input:focus { outline: none; border-color: var(--neon); }
  #room-code-input { width: 110px; text-align: center; }
  #room-list {
    width: 420px; max-height: 240px; overflow-y: auto;
    border: 1px solid rgba(39, 232, 255, 0.25); border-radius: 4px;
    margin-top: 8px; text-align: left;
  }
  #room-list .room-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px; font-size: 14px; letter-spacing: 1px;
    border-bottom: 1px solid rgba(39, 232, 255, 0.12);
  }
  #room-list .room-row b { color: var(--neon); }
  #room-list .room-row .grow { flex: 1; color: #8fd8e6; }
  #room-list .empty { padding: 16px; color: #6fb7c4; font-size: 13px; text-align: center; }
  .join-btn {
    pointer-events: auto; cursor: pointer; font-family: inherit;
    font-size: 12px; letter-spacing: 2px; color: #05121a;
    background: var(--neon); border: none; border-radius: 3px; padding: 5px 14px;
  }
  #mp-status { min-height: 20px; margin-top: 14px; font-size: 13px; color: var(--warn); letter-spacing: 1px; }
  #server-panel {
    display: flex; gap: 10px; align-items: center; margin-bottom: 18px;
    padding: 10px 14px; border: 1px solid rgba(39, 232, 255, 0.25); border-radius: 4px;
  }
  #server-input { width: 240px; text-transform: none; }
  .status-badge {
    font-size: 11px; letter-spacing: 2px; padding: 4px 10px; border-radius: 3px;
    border: 1px solid; white-space: nowrap;
  }
  .status-badge.disconnected { color: #8a97a8; border-color: #8a97a8; }
  .status-badge.connecting { color: var(--warn); border-color: var(--warn); animation: blink 0.8s step-end infinite; }
  .status-badge.connected { color: #4dff88; border-color: #4dff88; box-shadow: 0 0 8px rgba(77,255,136,.4); }
  .status-badge.failed { color: var(--danger); border-color: var(--danger); }
  #lobby-players {
    width: 380px; margin: 10px 0 22px; text-align: left;
    border: 1px solid rgba(39, 232, 255, 0.25); border-radius: 4px;
  }
  #lobby-players .p-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; font-size: 15px; letter-spacing: 1px;
    border-bottom: 1px solid rgba(39, 232, 255, 0.12);
  }
  #lobby-players .p-row .grow { flex: 1; }
  #lobby-players .tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; letter-spacing: 2px; }
  #lobby-players .tag.host { color: var(--warn); border: 1px solid rgba(255, 207, 59, 0.5); }
  #lobby-players .tag.ready { color: #4dff88; border: 1px solid rgba(77, 255, 136, 0.5); }
  #lobby-players .tag.notready { color: #6fb7c4; border: 1px solid rgba(110, 183, 196, 0.4); }
  #lobby-code { font-size: 30px; letter-spacing: 10px; color: var(--warn); margin-bottom: 4px; }
  #spectate-note {
    position: absolute; left: 50%; top: 60%; transform: translateX(-50%);
    font-size: 20px; letter-spacing: 4px; color: var(--danger);
    text-shadow: 0 0 14px var(--danger); white-space: nowrap;
    display: none;
  }
  #spectate-note.visible { display: block; }
  #mp-scores {
    margin-bottom: 26px; min-width: 380px;
  }
  #mp-scores .s-row {
    display: flex; gap: 14px; padding: 8px 18px; font-size: 17px; letter-spacing: 1px;
    border-bottom: 1px solid rgba(39, 232, 255, 0.15);
  }
  #mp-scores .s-row .grow { flex: 1; text-align: left; }
  #mp-scores .s-row b { color: var(--neon); }
</style>
</head>
<body>

<div id="hud">
  <div id="vignette"></div>
  <div id="lowhp"></div>
  <div id="crosshair"><span class="t"></span><span class="b"></span><span class="l"></span><span class="r"></span><span class="dot"></span></div>
  <div id="hitmarker"><span class="t"></span><span class="b"></span><span class="l"></span><span class="r"></span></div>
  <div id="dmgdirs"></div>
  <div id="scope"><div class="mask"></div><div class="lineh"></div><div class="linev"></div></div>

  <div class="panel" id="health-panel">
    <div id="health-label" data-i18n="hud.integrity"></div>
    <div id="health-value">100</div>
    <div id="health-bar-track"><div id="health-bar"></div></div>
    <div id="armor-track"><div id="armor-bar"></div></div>
  </div>

  <div class="panel" id="ammo-panel">
    <div id="weapon-name">P-9 SIDEARM</div>
    <div id="ammo-value">&infin;</div>
    <div id="ammo-reserve"></div>
    <div id="grenade-row"></div>
    <div id="reload-hint" data-i18n="hud.reload"></div>
  </div>

  <div class="panel" id="score-panel">
    <div id="score-label" data-i18n="hud.score"></div>
    <div id="score-value">0</div>
    <div id="wave-label" data-i18n="hud.wave"></div>
    <div id="wave-value">1</div>
    <div id="enemies-left"></div>
    <div id="streak-value"></div>
    <div id="rank-value" style="font-size:12px;color:#7fdceb"></div>
  </div>

  <div id="killfeed"></div>

  <div class="panel" id="radar-panel"><canvas id="radar" width="140" height="140"></canvas></div>
  <canvas id="compass" width="340" height="30"></canvas>

  <div id="banner"></div>
  <div id="subbanner"></div>
  <div id="spectate-note" data-i18n="mp.spectating"></div>
  <div id="mount-hint" data-i18n="vehicle.hint"></div>
  <div id="vehicle-hp"></div>
  <div id="oob-warning"></div>
</div>

<button id="lang-btn">繁體中文</button>

<div class="screen visible" id="menu-screen">
  <h1>NEON STRIKE</h1>
  <div class="sub" data-i18n="menu.subtitle"></div>
  <div id="menu-rank"></div>
  <div class="btn-row">
    <button class="btn" id="start-btn" data-i18n="menu.solo"></button>
    <button class="btn secondary" id="mp-btn" data-i18n="menu.multiplayer"></button>
  </div>
  <div class="controls" data-i18n-html="menu.controls"></div>
  <div class="arsenal" id="arsenal"></div>
</div>

<div class="screen" id="setup-screen">
  <h2 data-i18n="setup.title"></h2>
  <div class="setup-label" data-i18n="setup.mode"></div>
  <div class="pick-row">
    <button class="pick" id="mode-survival"><span data-i18n="mode.survival"></span><small data-i18n="mode.survival.d"></small></button>
    <button class="pick" id="mode-strike"><span data-i18n="mode.strike"></span><small data-i18n="mode.strike.d"></small></button>
    <button class="pick" id="mode-domination"><span data-i18n="mode.domination"></span><small data-i18n="mode.domination.d"></small></button>
    <button class="pick" id="mode-versus"><span data-i18n="mode.versus"></span><small data-i18n="mode.versusBots.d"></small></button>
  </div>
  <div class="setup-label" data-i18n="setup.difficulty"></div>
  <div class="pick-row">
    <button class="pick" id="diff-easy" data-i18n="diff.easy"></button>
    <button class="pick" id="diff-normal" data-i18n="diff.normal"></button>
    <button class="pick" id="diff-hard" data-i18n="diff.hard"></button>
    <button class="pick" id="diff-expert" data-i18n="diff.expert"></button>
  </div>
  <div class="setup-label" data-i18n="setup.map"></div>
  <div class="pick-row">
    <button class="pick" id="map-arena" data-i18n="map.arena"></button>
    <button class="pick" id="map-battlefield" data-i18n="map.battlefield"></button>
    <button class="pick" id="map-station" data-i18n="map.station"></button>
    <button class="pick" id="map-carrier" data-i18n="map.carrier"></button>
    <button class="pick" id="map-desert" data-i18n="map.desert"></button>
    <button class="pick" id="map-rooftop" data-i18n="map.rooftop"></button>
  </div>
  <div class="setup-label" data-i18n="setup.attach"></div>
  <div class="pick-row">
    <button class="pick" id="attach-optic"></button>
    <button class="pick" id="attach-barrel"></button>
    <button class="pick" id="attach-mag"></button>
    <button class="pick" id="attach-grip"></button>
    <button class="pick" id="attach-muzzle"></button>
  </div>
  <div class="setup-label" data-i18n="setup.equip"></div>
  <div class="pick-row">
    <button class="pick" id="eq-plates"><span data-i18n="equip.plates"></span><small data-i18n="equip.plates.d"></small></button>
    <button class="pick" id="eq-helmet"><span data-i18n="equip.helmet"></span><small data-i18n="equip.helmet.d"></small></button>
    <button class="pick" id="eq-stim"><span data-i18n="equip.stim"></span><small data-i18n="equip.stim.d"></small></button>
    <button class="pick" id="eq-boots"><span data-i18n="equip.boots"></span><small data-i18n="equip.boots.d"></small></button>
  </div>
  <div class="btn-row" style="margin-top:26px">
    <button class="btn" id="deploy-btn" data-i18n="setup.deploy"></button>
    <button class="btn secondary" id="setup-back-btn" data-i18n="mp.back"></button>
  </div>
</div>

<div class="screen" id="mp-screen">
  <h2 data-i18n="mp.title"></h2>
  <div class="sub" data-i18n="mp.subtitle"></div>
  <div id="server-panel">
    <label class="setup-label" style="margin-top:0" data-i18n="server.label"></label>
    <input id="server-input" class="mp-form-input" placeholder="host:port" autocomplete="off"
      style="pointer-events:auto;font-family:inherit;font-size:14px;color:#d7faff;background:rgba(5,12,20,0.7);border:1px solid rgba(39,232,255,0.4);border-radius:3px;padding:8px 12px">
    <button class="join-btn" id="server-connect-btn" data-i18n="server.connect"></button>
    <span class="status-badge disconnected" id="server-status" data-i18n="server.disconnected"></span>
  </div>
  <div class="mp-form">
    <div class="row">
      <label data-i18n="mp.nickname"></label>
      <input id="name-input" maxlength="16" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn" id="quickplay-btn" data-i18n="mp.quickplay"></button>
      <button class="btn secondary" id="create-room-btn" data-i18n="mp.create"></button>
      <input id="room-code-input" maxlength="4" autocomplete="off" placeholder="CODE">
      <button class="btn secondary" id="join-code-btn" data-i18n="mp.join"></button>
    </div>
  </div>
  <div style="font-size:12px;letter-spacing:2px;color:var(--neon-dim)">
    <span data-i18n="mp.rooms"></span> &nbsp;
    <button class="join-btn" id="refresh-btn" data-i18n="mp.refresh"></button>
  </div>
  <div id="room-list"><div class="empty" data-i18n="mp.noRooms"></div></div>
  <div id="mp-status"></div>
  <button class="btn secondary" id="mp-back-btn" style="margin-top:18px" data-i18n="mp.back"></button>
</div>

<div class="screen" id="lobby-screen">
  <div id="lobby-code"></div>
  <div class="sub" data-i18n="mp.players"></div>
  <div id="lobby-players"></div>
  <div id="lobby-map-row" style="margin-bottom:16px">
    <span class="setup-label" data-i18n="setup.map"></span>
    <button class="pick" id="lobby-map-btn" style="margin-left:10px"></button>
    <span class="setup-label" style="margin-left:14px" data-i18n="setup.mode"></span>
    <button class="pick" id="lobby-mode-btn" style="margin-left:10px"></button>
    <span class="setup-label" style="margin-left:14px" data-i18n="setup.difficulty"></span>
    <button class="pick" id="lobby-diff-btn" style="margin-left:10px"></button>
  </div>
  <div class="btn-row">
    <button class="btn" id="ready-btn" data-i18n="mp.ready"></button>
    <button class="btn" id="start-match-btn" data-i18n="mp.start"></button>
    <button class="btn secondary" id="leave-lobby-btn" data-i18n="mp.leave"></button>
  </div>
  <div id="lobby-status" style="margin-top:16px;font-size:13px;color:#8fd8e6;letter-spacing:2px"></div>
</div>

<div class="screen" id="mpover-screen">
  <h2 data-i18n="mp.matchOver"></h2>
  <div id="mp-scores"></div>
  <button class="btn" id="mpover-lobby-btn" data-i18n="mp.backToLobby"></button>
</div>

<div class="screen" id="pause-screen">
  <h2 data-i18n="pause.title"></h2>
  <div class="btn-row">
    <button class="btn" id="resume-btn" data-i18n="pause.resume"></button>
    <button class="btn secondary" id="pause-leave-btn" style="display:none" data-i18n="mp.leave"></button>
  </div>
  <div class="settings">
    <label><span data-i18n="pause.sensitivity"></span> <input type="range" id="sens-slider" min="0.3" max="2.5" step="0.1" value="1"><span id="sens-value">1.0</span></label>
    <label><span data-i18n="pause.volume"></span> <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.7"><span id="vol-value">0.7</span></label>
  </div>
</div>

<div class="screen" id="gameover-screen">
  <h1 data-i18n="over.title"></h1>
  <div class="stats">
    <span data-i18n="over.score"></span> <b id="final-score">0</b> &nbsp;&nbsp;
    <span data-i18n="over.wave"></span> <b id="final-wave">1</b> &nbsp;&nbsp;
    <span data-i18n="over.kills"></span> <b id="final-kills">0</b><br>
    <span style="font-size:15px"><span data-i18n="over.bestStreak"></span> <b id="final-streak">0</b> &nbsp;&nbsp;
    <span data-i18n="over.bestScore"></span> <b id="best-score">0</b></span><br>
    <span style="font-size:14px" id="final-rank"></span>
    <div id="final-cheatnote" style="font-size:12px;color:#ffcf3b;letter-spacing:2px;margin-top:8px"></div>
  </div>
  <button class="btn" id="restart-btn" data-i18n="over.restart"></button>
</div>

<div id="cheat-frame"><div id="cheat-badge">⚠ CHEATS ACTIVE</div></div>
<div id="cheat-menu">
  <div class="cm-title" data-i18n="cheat.title"></div>
  <div class="cm-hint" data-i18n="cheat.hint"></div>
  <ul id="cheat-list"></ul>
</div>

<script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
